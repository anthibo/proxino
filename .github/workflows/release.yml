name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: npm ci && npx tsc --noEmit && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: web

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: dmg
            glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            glob: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: appimage,deb
            glob: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev
      - name: Build sidecar
        run: python desktop/sidecar/build.py
      - name: Smoke-test sidecar
        shell: bash
        run: python desktop/sidecar/smoke.py desktop/src-tauri/binaries/proxino-backend-*
      - name: Build desktop bundle
        working-directory: desktop
        run: npm ci && npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  wheel:
    name: Python wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - run: rm -rf proxino/web_dist && cp -r web/dist proxino/web_dist
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: dist/*, if-no-files-found: error }

  pypi:
    name: Publish to PyPI
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wheel, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Draft GitHub Release
    needs: [desktop, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Checksums + notes
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Proxino ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
