[package]
name = "desktop"
version = "0.1.0"
description = "Proxino desktop — self-hosted network inspector for mobile HTTPS"
authors = ["Abdulrahman Khalid"]
license = "MIT"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
