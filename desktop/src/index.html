<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxino</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1016; color: #e7eaf0;
        font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .logo { width: 56px; height: 56px; border-radius: 14px; background: #20213a; border: 1px solid #2a2b47;
        display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding-bottom: 16px; box-sizing: border-box; }
      .bar { width: 5px; border-radius: 3px; background: #4b5568; }
      .b3 { background: #7c6cf6; }
      .b1 { height: 10px; } .b2 { height: 16px; } .b3 { height: 24px; }
      .name { font-size: 20px; font-weight: 600; }
      .name b { color: #7c6cf6; }
      .status { font-size: 13px; color: #9aa3b2; }
      .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #7c6cf6;
        margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
      <div class="name"><b>Proxino</b></div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Starting the capture engine…</span></div>
    </div>
    <script>
      window.__proxinoStatus = function (msg, isError) {
        var text = document.getElementById("status-text");
        var box = document.getElementById("status");
        text.textContent = msg;
        if (isError) {
          box.style.color = "#ff7b7b";
          box.style.whiteSpace = "pre-wrap";
          box.style.maxWidth = "640px";
          box.style.textAlign = "center";
          box.style.fontFamily = "ui-monospace, Menlo, monospace";
          box.style.fontSize = "12px";
          var dot = box.querySelector(".dot");
          if (dot) dot.remove();
        }
      };
    </script>
  </body>
</html>
